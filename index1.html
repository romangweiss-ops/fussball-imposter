
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fußball Imposter</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#1a4a2e;min-height:100vh;overflow-x:hidden}
:root{
  --green-dark:#0f2d1a;
  --green-mid:#1a4a2e;
  --green-field:#2d6a4f;
  --green-light:#40916c;
  --green-bright:#52b788;
  --white:#ffffff;
  --yellow:#ffd60a;
  --red:#e63946;
  --gold:#f4a261;
  --shadow:rgba(0,0,0,0.4);
}

.app{min-height:100vh;background:linear-gradient(160deg,#0f2d1a 0%,#1a4a2e 40%,#2d6a4f 100%);position:relative;overflow:hidden}
.app::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,0.03) 0px,rgba(255,255,255,0.03) 1px,transparent 1px,transparent 80px),repeating-linear-gradient(0deg,rgba(255,255,255,0.03) 0px,rgba(255,255,255,0.03) 1px,transparent 1px,transparent 80px);pointer-events:none}

.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;position:relative;z-index:1}

.title-badge{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:50px;padding:6px 16px;font-size:12px;font-family:'Oswald',sans-serif;letter-spacing:2px;color:rgba(255,255,255,0.6);text-transform:uppercase;margin-bottom:12px}

h1{font-family:'Oswald',sans-serif;font-size:48px;font-weight:700;color:#fff;text-align:center;line-height:1;margin-bottom:4px;text-shadow:0 2px 20px rgba(0,0,0,0.5)}
h1 span{color:var(--yellow)}

.subtitle{font-size:14px;color:rgba(255,255,255,0.5);text-align:center;margin-bottom:32px}

.card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:24px;width:100%;max-width:360px;margin-bottom:16px;backdrop-filter:blur(4px)}

.label{font-size:11px;font-family:'Oswald',sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:12px}

.stepper{display:flex;align-items:center;gap:0;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.15)}
.stepper button{background:rgba(255,255,255,0.08);border:none;color:#fff;font-size:22px;width:52px;height:52px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.stepper button:hover{background:rgba(255,255,255,0.15)}
.stepper .val{flex:1;text-align:center;font-family:'Oswald',sans-serif;font-size:28px;font-weight:600;color:#fff;background:rgba(255,255,255,0.04)}

.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat-btn{background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px 8px;font-size:12px;font-family:'Oswald',sans-serif;letter-spacing:.5px;color:rgba(255,255,255,0.7);cursor:pointer;transition:all .15s;text-align:center;line-height:1.3}
.cat-btn:hover{background:rgba(255,255,255,0.12)}
.cat-btn.active{background:rgba(255,214,10,0.15);border-color:var(--yellow);color:var(--yellow)}

.name-input-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.name-input-row:last-child{margin-bottom:0}
.name-input-row label{font-size:13px;font-family:'Oswald',sans-serif;letter-spacing:.5px;color:rgba(255,255,255,0.45);width:74px;flex-shrink:0}
.name-input{flex:1;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:11px 14px;color:#fff;font-size:15px;font-family:'Inter',sans-serif}
.name-input::placeholder{color:rgba(255,255,255,0.3)}
.name-input:focus{outline:none;border-color:var(--yellow);background:rgba(255,255,255,0.12)}

.btn-primary{width:100%;max-width:360px;padding:18px;background:var(--yellow);border:none;border-radius:16px;font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;letter-spacing:1px;color:#0f2d1a;cursor:pointer;transition:all .15s;text-transform:uppercase}
.btn-primary:hover{background:#ffe033;transform:translateY(-1px)}
.btn-primary:active{transform:translateY(1px)}

.btn-secondary{width:100%;max-width:360px;padding:16px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:16px;font-family:'Oswald',sans-serif;font-size:17px;font-weight:600;letter-spacing:.5px;color:#fff;cursor:pointer;transition:all .15s}
.btn-secondary:hover{background:rgba(255,255,255,0.15)}

.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:#ff4d5a}

.player-indicator{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.pip{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.2)}
.pip.done{background:var(--green-bright)}
.pip.current{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}

.role-reveal{text-align:center;padding:32px 20px}
.role-term{font-family:'Oswald',sans-serif;font-size:42px;font-weight:700;color:#fff;line-height:1.1;margin:16px 0}
.role-term.imposter{color:var(--red)}
.role-tag{display:inline-block;padding:4px 14px;border-radius:50px;font-size:11px;font-family:'Oswald',sans-serif;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.role-tag.normal{background:rgba(82,183,136,0.2);color:var(--green-bright);border:1px solid rgba(82,183,136,0.3)}
.role-tag.imposter{background:rgba(230,57,70,0.2);color:var(--red);border:1px solid rgba(230,57,70,0.3)}

.cover-screen{position:relative;width:100%;max-width:360px;cursor:pointer}
.cover-card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:40px 24px;text-align:center;transition:all .2s}
.cover-card:hover{background:rgba(255,255,255,0.1)}
.cover-icon{font-size:56px;margin-bottom:12px;display:block}
.cover-name{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;color:#fff;margin-bottom:6px}
.cover-hint{font-size:13px;color:rgba(255,255,255,0.45)}

.timer-ring{position:relative;width:120px;height:120px;margin:0 auto 16px}
.timer-ring svg{transform:rotate(-90deg)}
.timer-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:32px;font-weight:700;color:#fff}
.timer-text.urgent{color:var(--red)}

.result-card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:28px;width:100%;max-width:360px;text-align:center;margin-bottom:16px}
.result-number{font-family:'Oswald',sans-serif;font-size:64px;font-weight:700;color:var(--yellow);line-height:1}
.result-label{font-size:13px;color:rgba(255,255,255,0.5);margin-top:4px}
.result-term{font-family:'Oswald',sans-serif;font-size:32px;font-weight:700;color:var(--green-bright);margin:12px 0 4px}
.divider{height:1px;background:rgba(255,255,255,0.1);margin:16px 0}

.imposter-select-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.imposter-select-row span{font-size:15px;color:rgba(255,255,255,0.8)}

.vote-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:360px;margin-bottom:16px}
.vote-btn{background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.12);border-radius:14px;padding:14px 8px;font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;color:#fff;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:4px}
.vote-btn:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.25)}
.vote-btn.selected{background:rgba(230,57,70,0.2);border-color:var(--red);color:var(--red)}
.vote-player-num{font-size:24px}

.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.phase-badge{display:inline-block;padding:4px 14px;border-radius:50px;font-size:11px;font-family:'Oswald',sans-serif;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:16px;background:rgba(255,214,10,0.15);color:var(--yellow);border:1px solid rgba(255,214,10,0.25)}

.imposter-reveal{background:linear-gradient(135deg,rgba(230,57,70,0.15),rgba(230,57,70,0.05));border-color:rgba(230,57,70,0.3)}

.emoji-big{font-size:64px;display:block;text-align:center;margin-bottom:8px}
</style>
</head>

  "Gruppe F": ["Niederlande","Japan","Schweden","Tunesien"],
  "Gruppe G": ["Belgien","Ägypten","Iran","Neuseeland"],
  "Gruppe H": ["Spanien","Kap Verde","Saudi-Arabien","Uruguay"],
  "Gruppe I": ["Frankreich","Senegal","Irak","Norwegen"],
  "Gruppe J": ["Argentinien","Algerien","Österreich","Jordanien"],
  "Gruppe K": ["Portugal","DR Kongo","Usbekistan","Kolumbien"],
  "Gruppe L": ["England","Kroatien","Ghana","Panama"]
};

const wmGroupNodes = Object.entries(WM_GROUPS).map(([groupName,teams])=>{
  const teamNodes=teams.map(team=>({key:"WM-"+team,label:team,words:WM_SQUADS[team]}));
  return {key:"WM-"+groupName,label:groupName,words:teamNodes.flatMap(t=>t.words),children:teamNodes};
});

const wmNode = {key:"Weltmeisterschaft 2026",label:"Weltmeisterschaft 2026",words:wmGroupNodes.flatMap(g=>g.words),children:wmGroupNodes};

const CATEGORY_TREE = [
  {key:"Alle",label:"Alle",words:ALL_WORDS},
  {key:"Spieler",label:"Spieler",words:WORDS["Spieler"],children:[wmNode]},
  {key:"Regeln & Spielzug",label:"Regeln & Spielzug",words:WORDS["Regeln & Spielzug"]},
  {key:"Stadien",label:"Stadien",words:WORDS["Stadien"]},
  {key:"Vereine",label:"Vereine",words:WORDS["Vereine"],children:[
    {key:"Deutschland",label:"Deutschland",words:WORDS["Deutschland"]},
    {key:"England",label:"England",words:WORDS["England"]}
  ]}
];

function registerCategoryWords(nodes){
  nodes.forEach(n=>{
    if(n.words) WORDS[n.key]=n.words;
    if(n.children) registerCategoryWords(n.children);
  });
}
registerCategoryWords(CATEGORY_TREE);

function findCategoryNode(path){
  let nodes=CATEGORY_TREE,node=null;
  for(const key of path){
    node=nodes.find(n=>n.key===key);
    if(!node) return null;
    nodes=node.children||[];
  }
  return node;
}

function categoryChildrenAt(path){
  if(!path.length) return CATEGORY_TREE;
  const node=findCategoryNode(path);
  return node?(node.children||[]):[];
}

function categoryBreadcrumbs(path){
  const labels=[]; let nodes=CATEGORY_TREE;
  for(const key of path){
    const node=nodes.find(n=>n.key===key);
    if(!node) break;
    labels.push(node.label);
    nodes=node.children||[];
  }
  return labels;
}

function findCategoryPath(key,nodes=CATEGORY_TREE,path=[]){
  for(const n of nodes){
    const next=[...path,n.key];
    if(n.key===key) return next;
    if(n.children){
      const found=findCategoryPath(key,n.children,next);
      if(found) return found;
    }
  }
  return null;
}

function navigateCategory(path){
  const node=findCategoryNode(path);
  if(!node) return;
  const updates={catNav: node.children ? path : path.slice(0,-1)};
  if(node.words) updates.category=node.key;
  setState(updates);
}

function backCategory(){
  setState({catNav:(state.catNav||[]).slice(0,-1)});
}

function getWords(cat){
  if(cat==="Alle") return ALL_WORDS;
  return WORDS[cat]||ALL_WORDS;
}

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function playerName(i){
  return (state.playerNames&&state.playerNames[i])||("Spieler "+(i+1));
}

let state = {
  screen:"setup",
  setupStep:1,
  players:4,
  playerNames:[],
  category:"Alle",
  catNav:[],
  imposterIndex:0,
  secretWord:"",
  currentPlayer:0,
  revealed:false,
  timeLeft:180,
  timerRunning:false,
  voteSelected:null,
  resolved:false
};

let timerInterval=null;

function setState(updates){
  Object.assign(state,updates);
  render();
}

function goToNamesStep(){
  const names=Array.from({length:state.players},(_,i)=>state.playerNames[i]||"");
  setState({playerNames:names,setupStep:2});
}

function updatePlayerName(i,value){
  state.playerNames[i]=value;
}

function goToCategoryStep(){
  const names=state.playerNames.map((n,i)=>(n&&n.trim())?n.trim():"Spieler "+(i+1));
  const fullPath=findCategoryPath(state.category)||[];
  setState({playerNames:names,setupStep:3,catNav:fullPath.slice(0,-1)});
}

function startGame(){
  const words=getWords(state.category);
  const word=words[Math.floor(Math.random()*words.length)];
  const imp=Math.floor(Math.random()*state.players);
  setState({screen:"roles",imposterIndex:imp,secretWord:word,currentPlayer:0,revealed:false,timeLeft:180,timerRunning:false,voteSelected:null,resolved:false});
}

function startTimer(){
  if(timerInterval)clearInterval(timerInterval);
  setState({timerRunning:true});
  timerInterval=setInterval(()=>{
    if(state.timeLeft<=1){
      clearInterval(timerInterval);
      setState({timeLeft:0,timerRunning:false});
    } else {
      state.timeLeft--;
      document.getElementById("timer-val")&&(document.getElementById("timer-val").textContent=formatTime(state.timeLeft));
      document.getElementById("timer-val")&&(document.getElementById("timer-val").className="timer-text"+(state.timeLeft<=30?" urgent":""));
      updateTimerRing();
    }
  },1000);
}

function formatTime(s){
  return Math.floor(s/60)+":"+(s%60<10?"0":"")+s%60;
}

function updateTimerRing(){
  const el=document.getElementById("timer-arc");
  if(!el)return;
  const pct=state.timeLeft/180;
  const r=50,circ=2*Math.PI*r;
  el.setAttribute("stroke-dashoffset",circ*(1-pct));
  el.setAttribute("stroke",state.timeLeft<=30?"#e63946":"#52b788");
}

function reveal(){setState({revealed:true})}

function next(){
  const next=state.currentPlayer+1;
  if(next>=state.players){
    setState({screen:"game",currentPlayer:0});
  } else {
    setState({currentPlayer:next,revealed:false});
  }
}

function goVote(){
  clearInterval(timerInterval);
  setState({screen:"vote"});
}

function selectVote(i){setState({voteSelected:i})}

function resolve(){
  if(state.voteSelected===null)return;
  setState({screen:"result"});
}

function newGame(){setState({screen:"setup",setupStep:1,catNav:[]})}

function pips(total,current,done){
  let h="";
  for(let i=0;i<total;i++){
    let cls="pip";
    if(i<done)cls+=" done";
    else if(i===current)cls+=" current";
    h+=`<div class="${cls}"></div>`;
  }
  return h;
}

function renderSetup(){
  if(state.setupStep===2) return renderSetupNames();
  if(state.setupStep===3) return renderSetupCategory();
  return renderSetupCount();
}

function renderSetupCount(){
  return `
<div class="screen fade-in">
  <div class="title-badge">Social Deduction Game</div>
  <h1>FUSSBALL<br><span>IMPOSTER</span></h1>
  <p class="subtitle">Finde den Hochstapler — oder sei es selbst ⚽</p>

  <div class="card">
    <div class="label">Wie viele Spieler sind es?</div>
    <div class="stepper">
      <button onclick="if(state.players>3)setState({players:state.players-1})">−</button>
      <div class="val">${state.players}</div>
      <button onclick="if(state.players<10)setState({players:state.players+1})">+</button>
    </div>
  </div>

  <button class="btn-primary" onclick="goToNamesStep()">Weiter</button>
</div>`;
}

function renderSetupNames(){
  return `
<div class="screen fade-in">
  <div class="title-badge">Social Deduction Game</div>
  <h2 style="font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;color:#fff;text-align:center;margin-bottom:4px">Wie heißt ihr?</h2>
  <p class="subtitle">Trag die Namen der ${state.players} Spieler ein</p>

  <div class="card">
    ${Array.from({length:state.players},(_,i)=>`
      <div class="name-input-row">
        <label>Spieler ${i+1}</label>
        <input class="name-input" type="text" maxlength="20" value="${esc(state.playerNames[i]||"")}" placeholder="Spieler ${i+1}" oninput="updatePlayerName(${i},this.value)">
      </div>
    `).join("")}
  </div>

  <button class="btn-primary" onclick="goToCategoryStep()">Weiter</button>
  <button class="btn-secondary" onclick="setState({setupStep:1})" style="margin-top:10px">← Zurück</button>
</div>`;
}

function renderSetupCategory(){
  const path=state.catNav||[];
  const levelNodes=categoryChildrenAt(path);
  const crumbs=categoryBreadcrumbs(path);
  return `
<div class="screen fade-in">
  <div class="title-badge">Social Deduction Game</div>
  <h2 style="font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;color:#fff;text-align:center;margin-bottom:4px">Worum geht's?</h2>
  <p class="subtitle">${crumbs.length?esc(crumbs.join(" › ")):"Wähle eine Kategorie"}</p>

  <div class="card">
    <div class="label">Kategorie</div>
    <div class="cat-grid">
      ${levelNodes.map(n=>{
        const childPath=[...path,n.key];
        const active=state.category===n.key;
        return `<div class="cat-btn${active?" active":""}" onclick='navigateCategory(${JSON.stringify(childPath)})'>${esc(n.label)}${n.children?" ›":""}</div>`;
      }).join("")}
    </div>
    ${path.length?`<button class="btn-secondary" onclick="backCategory()" style="margin-top:10px">← Eine Ebene zurück</button>`:""}
  </div>

  <button class="btn-primary" onclick="startGame()">⚽ Spiel starten</button>
  <button class="btn-secondary" onclick="setState({setupStep:2})" style="margin-top:10px">← Zurück zu den Namen</button>
</div>`;
}

function renderRoles(){
  const isLast=state.currentPlayer===state.players-1;
  if(!state.revealed){
    return `
<div class="screen fade-in">
  <div class="phase-badge">Rollenverteilung</div>
  <div style="display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap;justify-content:center">
    ${Array.from({length:state.players},(_,i)=>`<div class="pip${i<state.currentPlayer?" done":i===state.currentPlayer?" current":""}"></div>`).join("")}
  </div>

  <div class="cover-screen">
    <div class="cover-card" onclick="reveal()">
      <span class="cover-icon">🔒</span>
      <div class="cover-name">${esc(playerName(state.currentPlayer))}</div>
      <div class="cover-hint">Antippen um Rolle zu sehen</div>
    </div>
  </div>

  <p style="font-size:12px;color:rgba(255,255,255,0.3);margin-top:20px;text-align:center">Niemand sonst darf zuschauen</p>
</div>`;
  } else {
    const isImposter=state.currentPlayer===state.imposterIndex;
    return `
<div class="screen fade-in">
  <div class="phase-badge">Nur du siehst das</div>
  <div class="role-reveal">
    <span class="role-tag ${isImposter?"imposter":"normal"}">${isImposter?"🔴 Imposter":"🟢 Mitspieler"}</span>
    <div class="role-term ${isImposter?"imposter":""}">
      ${isImposter?"Du bist der<br>Imposter!":state.secretWord}
    </div>
    ${isImposter?`<p style="font-size:13px;color:rgba(255,255,255,0.5);margin-top:8px">Finde heraus worum es geht<br>und bleib unentdeckt!</p>`:`<p style="font-size:13px;color:rgba(255,255,255,0.5);margin-top:8px">Beschreibe den Begriff mit<br>einem einzigen Wort — ohne ihn zu sagen.</p>`}
  </div>

  <button class="btn-primary" onclick="next()">${isLast?"🏁 Alle haben ihre Rolle":"✓ Verstanden, weitergeben"}</button>
</div>`;
  }
}

function renderGame(){
  const mins=Math.floor(state.timeLeft/60);
  const secs=state.timeLeft%60;
  const r=50,circ=2*Math.PI*r;
  const pct=state.timeLeft/180;
  return `
<div class="screen fade-in">
  <div class="phase-badge">Spielphase</div>
  <h2 style="font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;color:#fff;text-align:center;margin-bottom:6px">Das Spiel beginnt!</h2>
  <p style="font-size:13px;color:rgba(255,255,255,0.5);text-align:center;margin-bottom:28px">Reihum: Jeder sagt <strong style="color:#fff">ein Wort</strong>, das den Begriff beschreibt</p>

  <div class="timer-ring">
    <svg width="120" height="120" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
      <circle id="timer-arc" cx="60" cy="60" r="${r}" fill="none" stroke="#52b788" stroke-width="8"
        stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct)}"
        stroke-linecap="round" style="transition:stroke-dashoffset .9s linear"/>
    </svg>
    <div class="timer-text${state.timeLeft<=30?" urgent":""}" id="timer-val">${formatTime(state.timeLeft)}</div>
  </div>

  <div style="display:flex;gap:10px;margin-bottom:32px">
    ${!state.timerRunning&&state.timeLeft===180?`<button class="btn-secondary" onclick="startTimer()" style="flex:1">▶ Timer starten</button>`:""}
    ${state.timerRunning?`<button class="btn-secondary" onclick="clearInterval(timerInterval);setState({timerRunning:false})" style="flex:1">⏸ Pause</button>`:""}
    ${!state.timerRunning&&state.timeLeft<180&&state.timeLeft>0?`<button class="btn-secondary" onclick="startTimer()" style="flex:1">▶ Weiter</button>`:""}
  </div>

  <button class="btn-primary btn-red" onclick="goVote()">🗳 Abstimmung starten</button>
</div>`;
}

function renderVote(){
  return `
<div class="screen fade-in">
  <div class="phase-badge">Abstimmung</div>
  <h2 style="font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;color:#fff;text-align:center;margin-bottom:6px">Wer ist der Imposter?</h2>
  <p style="font-size:13px;color:rgba(255,255,255,0.5);text-align:center;margin-bottom:24px">Mehrheitsentscheid — dann auflösen</p>

  <div class="vote-grid">
    ${Array.from({length:state.players},(_,i)=>`
      <button class="vote-btn${state.voteSelected===i?" selected":""}" onclick="selectVote(${i})">
        <span class="vote-player-num">👤</span>
        ${esc(playerName(i))}
      </button>
    `).join("")}
  </div>

  <button class="btn-primary${state.voteSelected===null?" ":" btn-red"}" onclick="resolve()" style="${state.voteSelected===null?"opacity:.4;pointer-events:none":""}">🔍 Auflösen</button>
</div>`;
}

function renderResult(){
  const correct=state.voteSelected===state.imposterIndex;
  return `
<div class="screen fade-in">
  <div class="phase-badge">Auflösung</div>
  <span class="emoji-big">${correct?"🎉":"😱"}</span>

  <div class="result-card${correct?"":" imposter-reveal"}">
    <p style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:8px">Der Imposter war</p>
    <div class="result-number">${esc(playerName(state.imposterIndex))}</div>
    <div style="display:flex;justify-content:center;margin-top:12px">
      <span class="role-tag imposter">${correct?"✓ Richtig erkannt":"✗ Falsch geraten"}</span>
    </div>
  </div>

  <div class="result-card">
    <p style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:4px">Das gesuchte Wort war</p>
    <div class="result-term">${state.secretWord}</div>
    <p style="font-size:12px;color:rgba(255,255,255,0.35)">Kategorie: ${state.category}</p>
  </div>

  <button class="btn-primary" onclick="newGame()">🔄 Neues Spiel</button>
</div>`;
}

function render(){
  const root=document.getElementById("root");
  if(!root)return;
  switch(state.screen){
    case"setup":root.innerHTML=renderSetup();break;
    case"roles":root.innerHTML=renderRoles();break;
    case"game":root.innerHTML=renderGame();if(state.timerRunning)updateTimerRing();break;
    case"vote":root.innerHTML=renderVote();break;
    case"result":root.innerHTML=renderResult();break;
  }
}

render();
</script>
</body>
</html>
